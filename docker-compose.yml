# Job Crawler - Docker Compose

services:
  # FlareSolverr - Cloudflare bypass proxy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - crawler-network

  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-crawler-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DB_SSL_ENABLED=${DB_SSL_ENABLED:-false}
      - DB_SSL_CA=${DB_SSL_CA}
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./certs:/app/certs:ro
    depends_on:
      - flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - crawler-network

  # Dashboard UI
  dashboard:
    build:
      context: ../Datamining-dashboard
      dockerfile: Dockerfile
    container_name: job-crawler-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - crawler-network
    restart: unless-stopped

networks:
  crawler-network:
    driver: bridge
